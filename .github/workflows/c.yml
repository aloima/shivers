name: C/C++ CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Update the system
      run: |
          sudo apt-get update
          sudo apt-get upgrade -y

    - name: Install dependencies
      run: sudo apt-get install libfreetype6 libfreetype-dev

    - name: Setup clang
      uses: egor-tensin/setup-clang@v1
      with:
        version: latest
        platform: x64

    - name: Create build directory
      run: mkdir build

    - name: Run CMake
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build -- -j$(nproc)
